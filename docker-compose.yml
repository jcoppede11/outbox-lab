services:
  # Base de datos PostgreSQL.
  # Solo loopback: la DB no queda expuesta a la red.
  postgres:
    image: postgres:17-alpine
    container_name: outbox-lab-postgres
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox_lab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio one-shot: aplica las migraciones y termina.
  # Corre en `docker compose up` (antes del backend) y también a mano:
  # docker compose run --rm migrate
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://outbox:outbox@postgres:5432/outbox_lab?sslmode=disable"
      - "up"

  # API Go del patrón outbox: arranca tras migrate y expone :8080.
  backend:
    build:
      context: ./backend
    image: outbox-lab-backend:local
    container_name: outbox-lab-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://outbox:outbox@postgres:5432/outbox_lab?sslmode=disable
      HTTP_ADDR: ":8080"
      RELAY_INTERVAL: 1s
      RELAY_BATCH: "50"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Frontend Angular servido por nginx, haciendo reverse-proxy de /api hacia el
  # backend (mismo origen, sin CORS). Es la forma visual de ver el patrón.
  frontend:
    build:
      context: ./frontend
    image: outbox-lab-frontend:local
    container_name: outbox-lab-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  pgdata:
