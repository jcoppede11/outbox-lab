<div class="mx-auto flex h-full max-w-6xl flex-col gap-4 overflow-hidden p-4 sm:p-6">
  <header class="flex flex-wrap items-center justify-between gap-2">
    <div class="flex flex-col gap-1">
      <h1 class="text-2xl font-bold text-slate-900">Outbox Lab</h1>
      <p class="text-sm text-slate-500"><strong class="text-slate-900 font-semibold">Transactional Outbox Pattern</strong> (Real-Time)</p>
    </div>
    @if (payments.offline()) {
      <span
        class="rounded-full bg-rose-100 px-3 py-1 text-sm font-medium text-rose-700"
        role="status"
      >
        sin conexión con el backend
      </span>
    }
  </header>

  <app-controls />

  <app-invariant-counter
    [payments]="payments.payments()"
    [outbox]="payments.outbox()"
    [broker]="payments.broker()"
  />

  <div class="grid min-h-0 flex-1 grid-cols-1 grid-rows-3 gap-4 lg:grid-cols-3 lg:grid-rows-1">
    <app-payments-panel [payments]="payments.payments()" />
    <app-outbox-panel [rows]="payments.outbox()" />
    <app-broker-panel [broker]="payments.broker()" />
  </div>
</div>
