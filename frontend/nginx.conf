server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas API (/api/state, /api/payments, /api/chaos) van al servicio.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Cualquier ruta desconocida, fallback a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
